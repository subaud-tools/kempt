# .tools family standard: identical in every family repo except the branch
# list and the gate's OS list. The same checks `just verify` runs locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      matrix:
        # kempt only runs on macOS, and its tests exercise macOS behaviour.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      - run: just prepare
      - uses: subaud-tools/tools-actions/go-ci@v0.11.0
        with:
          setup-go: "false"
  extra:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # extra builds nothing: only `gate` may save the shared setup-go key,
          # or a near-empty entry wins the save race and every run builds cold.
          cache: false
      - uses: extractions/setup-just@v4.0.0
      - run: just verify-extra
