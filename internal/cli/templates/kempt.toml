# kempt.toml — your machine, declared once.
#
# This is a starter config generated by `kempt new`. Edit it to describe the
# tools and dotfiles you want, then run `kempt lint` to check it and
# `kempt init <this-repo-url>` on a new machine to apply it.
#
# A config is a set of *packages*. Each package is a named bundle of *steps*.
# There are ten step kinds; this file exercises all of them so you can copy
# the shapes you need. Run `kempt schema` for the full reference.

[kempt]
# Spec version. Always 1 for now.
spec = 1

# ---------------------------------------------------------------------------
# A package grouping command-line tools and their dotfiles.
# ---------------------------------------------------------------------------
[packages.cli]
description = "Core command-line tools and shell config"

# install: packages from your OS package manager. Provide at least one of
# brew (macOS), winget (Windows), or apt (Debian/Ubuntu). kempt picks the one
# that matches the host.
[[packages.cli.install]]
brew.taps = ["homebrew/core"]
brew.formulas = ["ripgrep", "jq"]
winget = ["BurntSushi.ripgrep.MSVC", "jqlang.jq"]
apt = ["ripgrep", "jq"]

# symlink: link a file or directory from this repo into your home directory.
# `from` is relative to the repo; `to` may start with ~. backup=true renames
# any existing target aside before linking.
[[packages.cli.symlink]]
from = "config/zsh"
to = "~/.config/zsh"
backup = true

# line-in-file: ensure a single line is present in a file, adding it if absent.
[[packages.cli.line-in-file]]
file = "~/.zshrc"
line = "source ~/.config/zsh/init.zsh"

# verify: a read-only health check. Here we confirm a command is on PATH.
[[packages.cli.verify]]
command-exists = "rg"

# ---------------------------------------------------------------------------
# A package for a fetched binary and a background service, macOS-focused.
# ---------------------------------------------------------------------------
[packages.tools]
description = "Released binaries, cloned repos, and a background agent"
# needs lists other packages that must be applied first.
needs = ["cli"]

# github-release: download a named asset from a GitHub release and install the
# `bin` inside it. Use only.os / only.arch to pin platform-specific assets.
[[packages.tools.github-release]]
repo = "sharkdp/fd"
asset = "fd-v9.0.0-aarch64-apple-darwin.tar.gz"
bin = "fd"
only = { os = "darwin", arch = "arm64" }

# download: fetch a binary from a domain distribution. kempt resolves the
# version ("latest" by default, or pin one), downloads
# https://<site>/dl/<tool>/<ver>/<tool>_<os>_<arch>.tar.gz, verifies its
# .sha256 sidecar, and installs `bin` into ~/.local/bin. On a gated site,
# `product` (default: `tool`) is what this machine's sign-in must own.
[[packages.tools.download]]
site = "example.tools"
tool = "demo"
bin = "demo"

# git-clone: clone a repository to a path. `ref` pins a branch, tag, or commit.
[[packages.tools.git-clone]]
repo = "https://github.com/tmux-plugins/tpm"
to = "~/.tmux/plugins/tpm"
ref = "master"

# json-merge: deep-merge keys into a JSON file, creating it if needed. The
# `merge` table is free-form JSON.
[[packages.tools.json-merge]]
file = "~/.config/tools/settings.json"
merge = { theme = "dark", telemetry = false }

# toml-merge: deep-merge keys into a TOML file, creating it if needed. The
# `merge` table is free-form TOML (e.g. an agent's config.toml).
[[packages.tools.toml-merge]]
file = "~/.config/tools/config.toml"
merge = { model = "gpt-5", approval = "on-request" }

# service: register a background program. On macOS this is a launchd agent
# keyed by `label`; `program` is the argv to run.
[[packages.tools.service]]
label = "com.example.syncer"
program = ["/usr/bin/true"]
only = { os = "darwin" }

# ---------------------------------------------------------------------------
# Profiles are named selections of packages, offered when you run kempt init.
# Every package referenced here must exist above.
# ---------------------------------------------------------------------------
[profiles.developer]
description = "Everything: tools, dotfiles, and services"
packages = ["cli", "tools"]

[profiles.minimal]
description = "Just the core command-line tools"
packages = ["cli"]
